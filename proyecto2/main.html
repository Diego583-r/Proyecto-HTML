<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Flipper</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Color Flipper</h1>
    <div class="container">
        <button id="btn" onclick="setColor('green')">Green</button>
        <button id="btn2" onclick="setColor('blue')">Blue</button>
        <button id="btn3" onclick="setColor('red')">Red</button>
        <button id="btn4" onclick="randomColor()">Random</button>
    </div>

    <script src="script.js"></script>
</body>

</html>
